<!doctype html><html><head><meta charset="utf-8"><title>Maqueta · Tren congelado</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:360px;height:640px;overflow:hidden;transform-origin:center;
  background:radial-gradient(ellipse at 50% 45%,#16365a 0%,#0b1d33 55%,#050c18 100%);font-family:Impact,"Arial Black",system-ui,sans-serif}
/* fondo que se "calienta" al descongelarse */
.warm{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#1f4470 0%,#0f2443 50%,#071224 100%);opacity:0}
.run .warm{animation:fadeIn .6s ease-out 2.4s forwards}
/* marco de neón */
.frame{position:absolute;inset:42px 25px;border-radius:44px;border:3px solid #7dd3fc;opacity:.35;box-shadow:0 0 12px rgba(125,211,252,.35)}
.run .frame{animation:neonOn .5s steps(4) 2.4s forwards}
@keyframes neonOn{0%{opacity:.35}25%{opacity:1;border-color:#ef4444}50%{opacity:.3}100%{opacity:1;border-color:#ef4444;box-shadow:0 0 18px #ef4444,inset 0 0 18px rgba(239,68,68,.45)}}
/* título */
.title{position:absolute;top:110px;left:0;right:0;text-align:center}
.t1{font-size:44px;letter-spacing:.5px;text-transform:uppercase;color:transparent;
  background:linear-gradient(#ffffff,#cfeaff 45%,#7cb8e8);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 6px rgba(186,230,253,.7))}
.t2{font-size:32px;letter-spacing:9px;color:#bae6fd;text-shadow:0 0 8px #7dd3fc}
.run .t1{animation:thawTitle .6s ease-out 2.45s forwards}
.run .t2{animation:thawV5 .6s ease-out 2.45s forwards}
@keyframes thawTitle{to{filter:drop-shadow(0 0 0 transparent);background-image:linear-gradient(#fff,#e2e8f0 50%,#94a3b8)}}
@keyframes thawV5{to{color:#fecaca;text-shadow:0 0 10px #ef4444,0 0 2px #000}}
.ticl{position:absolute;top:157px;left:70px;right:70px;height:14px}
.ticl b{position:absolute;top:0;width:4px;background:linear-gradient(#e0f2fe,rgba(186,230,253,0));clip-path:polygon(0 0,100% 0,50% 100%)}
.run .ticl{animation:drop .7s ease-in 2.4s forwards}
.legend{position:absolute;top:215px;left:0;right:0;text-align:center;font:800 12px system-ui,sans-serif;letter-spacing:2px;color:#bbf7d0;opacity:0}
.run .legend{animation:fadeIn .5s ease-out 2.9s forwards}
/* tren + bloque de hielo */
.scene{position:absolute;top:300px;left:0;right:0;height:120px}
.trwrap{position:absolute;left:50%;top:22px;width:250px;margin-left:-125px}
.trsvg{width:100%;display:block;filter:saturate(.1) brightness(1.15) hue-rotate(170deg)}
.run .trsvg{animation:trainThaw .4s ease-out 2.4s forwards}
@keyframes trainThaw{to{filter:saturate(1) brightness(1) hue-rotate(0deg) drop-shadow(0 0 10px rgba(239,68,68,.55))}}
.run .trwrap{animation:shake1 .25s linear .6s 2,shake2 .3s linear 1.3s 2,shake3 .35s linear 1.9s 2}
@keyframes shake1{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
@keyframes shake2{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
@keyframes shake3{20%{transform:translate(-4px,1px) rotate(-.6deg)}60%{transform:translate(4px,-1px) rotate(.6deg)}}
@keyframes depart{0%{transform:translateX(0)}15%{transform:translateX(-6px)}100%{transform:translateX(420px)}}
.streak{position:absolute;height:2px;left:-40%;width:45%;background:linear-gradient(90deg,transparent,#fde68a);opacity:0;border-radius:2px}
.run .streak{animation:streak .5s ease-out 3.3s 3}
@keyframes streak{0%{opacity:0;transform:translateX(0)}30%{opacity:.9}100%{opacity:0;transform:translateX(-120px)}}
.ice{position:absolute;left:50%;top:0;width:286px;height:96px;margin-left:-143px;border-radius:12px;overflow:visible}
.ice .body{position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(160deg,rgba(224,242,254,.55),rgba(125,211,252,.28) 45%,rgba(186,230,253,.5));
  border:1.5px solid rgba(255,255,255,.7);box-shadow:inset 0 0 18px rgba(255,255,255,.55),0 0 22px rgba(125,211,252,.35);backdrop-filter:blur(1.2px)}
.ice .body::before{content:"";position:absolute;left:10px;top:8px;width:60%;height:10px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.7),transparent)}
.fs{position:absolute;color:rgba(255,255,255,.55)}
.icl{position:absolute;bottom:-14px;width:6px;background:linear-gradient(#e0f2fe,rgba(186,230,253,.1));clip-path:polygon(0 0,100% 0,50% 100%)}
.cracks{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cracks path{fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;filter:drop-shadow(0 0 2px #7dd3fc);stroke-dasharray:200;stroke-dashoffset:200}
.run .c1{animation:crack .3s ease-out .8s forwards}
.run .c2{animation:crack .3s ease-out 1.4s forwards}
.run .c3{animation:crack .3s ease-out 2.0s forwards}
@keyframes crack{to{stroke-dashoffset:0}}
.run .ice .body,.run .ice .cracks,.run .ice .icl{animation:hide 0s linear 2.4s forwards}
@keyframes hide{to{opacity:0}}
.shard{position:absolute;inset:0;border-radius:12px;opacity:0;
  background:linear-gradient(160deg,rgba(224,242,254,.75),rgba(125,211,252,.45) 45%,rgba(186,230,253,.7));
  box-shadow:inset 0 0 14px rgba(255,255,255,.7)}
.run .shard{animation:shatter .9s cubic-bezier(.2,.7,.4,1) 2.4s forwards}
@keyframes shatter{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(calc(var(--dx)*2.2),calc(var(--dy)*2.2 + 60px)) rotate(var(--r)) scale(.7)}}
.track{position:absolute;top:400px;left:40px;right:40px;height:2px;background:linear-gradient(90deg,transparent,#7dd3fc,transparent);opacity:.6}
.run .track{animation:trackOn .4s ease-out 2.5s forwards}
@keyframes trackOn{to{opacity:0}}
/* destello y escarcha en los bordes */
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,#fff,rgba(255,255,255,0) 60%);opacity:0;pointer-events:none}
.run .flash{animation:flash .45s ease-out 2.38s}
@keyframes flash{0%{opacity:0}20%{opacity:.95}100%{opacity:0}}
.frost{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(224,242,254,.28) 78%,rgba(240,249,255,.55) 100%)}
.run .frost{animation:fadeOut .8s ease-out 2.4s forwards}
.sn{position:absolute;top:-6px;border-radius:50%;background:#fff;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(660px)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes fadeOut{to{opacity:0}}
@keyframes drop{to{transform:translateY(90px);opacity:0}}

/* "IT'S TIIIME!" */
.its{position:absolute;top:448px;left:0;right:0;text-align:center;font-size:40px;letter-spacing:1px;white-space:nowrap}
.its span{display:inline-block;opacity:0;color:#fff;
  background:linear-gradient(#fff7d6,#fde68a 45%,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 6px rgba(245,158,11,.75)) drop-shadow(0 0 14px rgba(192,38,211,.55))}
.its .sp{width:12px}
.run .its span{animation:letter .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes letter{0%{opacity:0;transform:translateY(24px) scale(.3)}100%{opacity:1;transform:none}}
.run .its{animation:pulse .5s ease-in-out 3.4s 4 alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.sub{position:absolute;top:500px;left:0;right:0;text-align:center;font:800 11px system-ui;letter-spacing:3px;color:#f5d0fe;opacity:0}
.run .sub{animation:fadeIn .5s ease-out 3.6s forwards}
/* icono de sonido con ondas */
.spk{position:absolute;top:58px;right:44px;width:34px;height:34px;opacity:0}
.run .spk{animation:pop .35s cubic-bezier(.3,1.6,.5,1) 2.5s forwards}
.spk svg{width:100%;height:100%;overflow:visible}
.spk .w{fill:none;stroke:#fde68a;stroke-width:2.2;stroke-linecap:round;opacity:0}
.run .spk .w1{animation:wave 1s ease-out 2.7s infinite}
.run .spk .w2{animation:wave 1s ease-out 2.9s infinite}
.run .spk .w3{animation:wave 1s ease-out 3.1s infinite}
@keyframes wave{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:none}}
/* notas musicales que suben */
.nt{position:absolute;font:700 22px system-ui;color:#fde68a;opacity:0;text-shadow:0 0 8px rgba(245,158,11,.8)}
.run .nt{animation:note 1.8s ease-out forwards}
@keyframes note{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),-150px) rotate(var(--r)) scale(1.1)}}
.tap{position:absolute;bottom:4px;left:0;right:0;text-align:center;font:700 11px system-ui;color:rgba(253,230,138,.8)}

.diva{position:absolute;left:22px;top:420px;width:150px;height:210px;opacity:0;transform:translateY(120px)}
.run .diva{animation:divaIn .6s cubic-bezier(.3,1.5,.5,1) 2.55s forwards}
@keyframes divaIn{to{opacity:1;transform:none}}
.dv{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.hairb{transform-origin:75px 60px}
.run .hairb{animation:sway 1.2s ease-in-out 2.8s infinite alternate}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.arm{transform-origin:112px 146px;transform:rotate(40deg)}
.run .arm{animation:armUp .5s cubic-bezier(.3,1.6,.5,1) 2.9s forwards}
@keyframes armUp{to{transform:rotate(0)}}
.mo{opacity:0}
@keyframes talk{0%{opacity:1}50%{opacity:0}}
@keyframes talkc{0%{opacity:0}50%{opacity:1}}
.bubble{position:absolute;left:138px;top:-2px;background:#fff;color:#7c1d6f;border-radius:18px;padding:10px 14px;
  font:900 19px Impact,"Arial Black",system-ui,sans-serif;white-space:nowrap;box-shadow:0 0 0 3px #f5c542,0 0 22px rgba(245,197,66,.7);
  opacity:0;transform:scale(.2);transform-origin:0 100%}
.bubble i{position:absolute;left:-10px;bottom:10px;width:0;height:0;border:10px solid transparent;border-right:14px solid #fff;border-left:0}
.run .bubble{animation:pop .35s cubic-bezier(.3,1.6,.5,1) 3.0s forwards,pulse .5s ease-in-out 3.6s 4 alternate}
.bt{background:linear-gradient(#c026d3,#7c1d6f);-webkit-background-clip:text;background-clip:text;color:transparent}
.spark{position:absolute;color:#fde68a;font-size:14px;opacity:0;text-shadow:0 0 8px #f5c542}
.run .spark{animation:tw .8s ease-in-out 3.0s infinite alternate}
@keyframes tw{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1.2)}}

/* convoy: tren + Papá Noel */
.convoy{position:absolute;inset:0}
.run .convoy{animation:fly 1.6s cubic-bezier(.5,0,.8,.45) 3.5s forwards}
@keyframes fly{0%{transform:translate(0,0)}12%{transform:translate(-8px,2px)}100%{transform:translate(470px,-230px) rotate(-12deg)}}
.trscale{position:absolute;inset:0;transform-origin:180px 58px}
.run .trscale{animation:shrink .55s ease-in-out 2.55s forwards}
@keyframes shrink{to{transform:translateX(-96px) scale(.62)}}
.sleigh{position:absolute;left:167px;top:22px;width:184px;opacity:0;transform:translate(260px,-260px) rotate(18deg)}
.run .sleigh{animation:land 1.0s cubic-bezier(.2,.8,.3,1) 2.6s forwards}
@keyframes land{0%{opacity:1;transform:translate(260px,-260px) rotate(18deg)}70%{transform:translate(-6px,4px) rotate(-3deg)}100%{opacity:1;transform:none}}
.back{filter:brightness(.72)}
.slsvg{width:100%;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.run .bob{animation:bob .35s ease-in-out 2.6s infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.lg{transform-box:fill-box;transform-origin:50% 0}
.run .l1{animation:leg .22s ease-in-out 2.6s infinite alternate}
.run .l2{animation:leg .22s ease-in-out 2.71s infinite alternate-reverse}
@keyframes leg{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.nose{filter:drop-shadow(0 0 4px #ef4444)}
.run .nose{animation:tw .4s ease-in-out 2.6s infinite alternate}
.wave{transform-box:fill-box;transform-origin:100% 100%}
.run .wave{animation:hand .3s ease-in-out 3.3s 6 alternate}
@keyframes hand{to{transform:rotate(-25deg)}}
.ho{position:absolute;left:-6px;top:-30px;background:#fff;color:#b91c1c;font:900 13px system-ui,sans-serif;border-radius:12px;padding:4px 8px;white-space:nowrap;opacity:0;transform:scale(.2);transform-origin:50% 100%;box-shadow:0 0 0 2px #ef4444}
.run .ho{animation:pop .3s cubic-bezier(.3,1.6,.5,1) 3.2s forwards,hide 0s linear 4.2s forwards}
.rope{position:absolute;left:160px;top:52px;width:0;height:2px;background:#f5c542;box-shadow:0 0 6px #f5c542}
.run .rope{animation:rope .25s ease-out 3.35s forwards}
@keyframes rope{to{width:16px}}
/* estela de estrellas al despegar */
.trail{position:absolute;color:#fde68a;font-size:14px;opacity:0;text-shadow:0 0 8px #f5c542}
.run .trail{animation:trail 1.4s ease-out forwards}
@keyframes trail{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.6) translateY(10px)}}
/* guirnalda de luces en el marco y gorro en el título */
.lights{position:absolute;top:34px;left:40px;right:40px;height:20px;opacity:0}
.run .lights{animation:fadeIn .3s ease-out 2.7s forwards}
.lights i{position:absolute;top:4px;width:8px;height:11px;border-radius:50% 50% 45% 45%;animation:nvB 1.2s ease-in-out infinite alternate}
@keyframes nvB{from{opacity:1}to{opacity:.35}}
.hat{position:absolute;top:84px;left:12px;width:44px;opacity:0;transform:translateY(-40px) rotate(-30deg)}
.run .hat{animation:hatIn .5s cubic-bezier(.3,1.6,.5,1) 2.8s forwards}
@keyframes hatIn{to{opacity:1;transform:rotate(-18deg)}}

/* canto: letras que suben y bajan como una nota larga */
.sg{display:inline-block;color:#a21caf;-webkit-text-fill-color:#a21caf;text-shadow:0 1px 0 #f5d0fe}
.bubble .bt{background:none;color:#a21caf;-webkit-text-fill-color:#a21caf}
.sg.sp{width:6px}
.run .sg{animation:sing .55s ease-in-out calc(3.05s + var(--n)*.06s) 5 alternate}
@keyframes sing{from{transform:translateY(0)}to{transform:translateY(-6px) scale(1.12)}}
.bn{position:absolute;right:-12px;top:-14px;color:#f5c542;font:700 20px system-ui;text-shadow:0 0 8px rgba(245,197,66,.8)}
.run .bn{animation:tw .4s ease-in-out 3.0s infinite alternate}
/* boca abierta sostenida con vibrato (en vez de hablar) */
.mo{transform-box:fill-box;transform-origin:50% 40%}
.run .mo{animation:singOpen .2s ease-out 3.0s forwards,vib .14s ease-in-out 3.2s 9 alternate}
.run .mc{animation:hide 0s linear 3.0s forwards}
@keyframes singOpen{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes vib{from{transform:scaleY(1)}to{transform:scaleY(1.25)}}
/* cabeza hacia atrás, como una diva */
.dv{transform-origin:50% 75%}
.run .dv{animation:tilt .5s ease-out 3.0s forwards}
@keyframes tilt{to{transform:rotate(-5deg)}}
/* notas que salen de la boca */
.mn{position:absolute;color:#fde68a;font:700 15px system-ui;opacity:0;text-shadow:0 0 6px rgba(245,158,11,.9)}
.run .mn{animation:mnote 1.3s ease-out forwards}
@keyframes mnote{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(46px,-60px) rotate(18deg) scale(1.15)}}
.cap{position:absolute;bottom:-40px;left:0;right:0;text-align:center;font:600 11px system-ui;color:rgba(255,255,255,.45)}
</style></head><body>

<script>
var st=document.getElementById('stage');
function fit(){var s=Math.min(innerWidth/360,innerHeight/640);st.style.transform='scale('+s+')';}

var AC=null, sonido=false;
function ruido(t,dur,vol,fc){var n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  var s=AC.createBufferSource();s.buffer=b;var f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=fc;
  var g=AC.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(AC.destination);s.start(t);}
function campana(t,fr,vol){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=fr;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+1.3);}

function cantar(t){try{
  var src=AC.createOscillator();src.type='sawtooth';
  var lfo=AC.createOscillator(),ld=AC.createGain();lfo.frequency.value=5.6;ld.gain.value=0;lfo.connect(ld);ld.connect(src.frequency);
  var out=AC.createGain();out.gain.value=0;out.connect(AC.destination);
  [[850,1.0,9],[1220,.6,10],[2810,.35,12]].forEach(function(f){var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f[0];bp.Q.value=f[2];
    var g=AC.createGain();g.gain.value=f[1]*3;src.connect(bp).connect(g).connect(out);});
  var notas=[[0,659],[.18,784],[.42,880],[.62,988],[.80,880],[.95,988],[1.12,1175]];
  notas.forEach(function(n){src.frequency.setTargetAtTime(n[1],t+n[0],.025);});
  src.frequency.setValueAtTime(659,t);
  out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(.22,t+.06);out.gain.setValueAtTime(.22,t+.14);
