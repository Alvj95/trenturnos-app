name: Build TrenTurnos APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Google Play upload key (repo Settings → Secrets → Actions). Without it only the APK is built.
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npx cap sync android

      # The ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Assemble release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Google Play needs an App Bundle (.aab) signed with the private upload key.
      - name: Build Google Play bundle (AAB)
        if: env.UPLOAD_KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore" ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../TrenTurnos.aab

      - name: Package APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TrenTurnos.apk
          # Some browsers block raw .apk downloads; a zip copy gets through.
          zip -j TrenTurnos-apk.zip TrenTurnos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: trenturnos-apk
          path: TrenTurnos.apk
          if-no-files-found: error

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0.${{ github.run_number }}
          name: TrenTurnos v5.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            TrenTurnos.apk
            TrenTurnos-apk.zip
            TrenTurnos.aab
          body: |
            APK de Android de TrenTurnos (rama `${{ github.ref_name }}`).

            **Instalar:** descarga `TrenTurnos.apk` desde el teléfono, ábrelo y permite instalar apps de origen desconocido.

            Si el navegador bloquea la descarga del .apk, baja `TrenTurnos-apk.zip`, descomprímelo y abre el .apk que trae dentro.

            `TrenTurnos.aab` es para subirlo a Google Play Console (no se instala directamente en el teléfono).
